[project]
name = "forgeincellcorp"
version = "1.4.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic>=2.11.7,<3.0.0",
    "fastapi>=0.116.1,<0.117.0",
    "fastapi[standard]>=0.116.1,<0.117.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "uvicorn>=0.35.0,<0.36.0",
    "python-dotenv>=0.9.9,<2.0.0",
    "sqlalchemy>=2.0.43,<3.0.0",
    "alembic>=1.16.4,<2.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "psycopg2-binary>=2.9.0,<3.0.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "dask[distributed]>=2024.3.0,<2025",
    "httpx>=0.27.0,<0.28.0",
    "minio>=7.2.0,<8.0.0",
    "prometheus-client>=0.20.0,<1.0.0",
    "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
    "redis>=5.0.1,<6.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    "kombu>=5.4.0,<6.0.0",
    "setuptools>=80.0.0",
    "openai-agents>=0.1.0,<1.0.0",
    "openpyxl>=3.1.2,<4.0.0",
    "PyPDF2>=3.0.0,<4.0.0",
    "python-docx>=1.0.0,<2.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "mem0ai>=1.0.11",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pre-commit>=4.3.0",
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "flake8>=6.0.0",
    "mypy>=1.9.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C90"]
ignore = []

[tool.ruff.lint.mccabe]
max-complexity = 70

[tool.mypy]
python_version = "3.13"
pretty = true
show_error_codes = true
warn_unused_configs = true
ignore_missing_imports = true
follow_imports = "silent"
packages = ["service"]
disable_error_code = ["attr-defined", "assignment", "override", "arg-type", "operator", "dict-item", "union-attr", "name-defined", "misc", "valid-type", "method-assign"]

