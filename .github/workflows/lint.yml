name: Lint & Type Check

# Запуск: при любом push и при PR в main/dev
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, dev]

# Отмена предыдущих запусков для той же ветки при новом push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

# ─── Python сервисы ───────────────────────────────────────────────────────────
jobs:
  python-lint:
    name: Python — ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway_service
          - orchestrator
          - vllm_service
          - triton_inference
          - smolvla_service
          - communication_service
          - robot_edge

    steps:
      - name: Checkout (с submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Пропускаем если submodule пустой (ещё не реализован)
      - name: Проверить наличие pyproject.toml
        id: check
        run: |
          if [[ -f "services/${{ matrix.service }}/pyproject.toml" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::services/${{ matrix.service }}/pyproject.toml не найден — пропускаю"
          fi

      - name: Setup Python ${{ env.PYTHON_VERSION }}
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Poetry
        if: steps.check.outputs.exists == 'true'
        run: |
          pipx install poetry
          poetry config virtualenvs.in-project true

      - name: Cache Poetry virtualenv
        if: steps.check.outputs.exists == 'true'
        uses: actions/cache@v4
        with:
          path: services/${{ matrix.service }}/.venv
          key: venv-${{ matrix.service }}-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles(format('services/{0}/poetry.lock', matrix.service)) }}
          restore-keys: |
            venv-${{ matrix.service }}-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: services/${{ matrix.service }}
        run: poetry install --no-interaction --no-ansi --with dev

      - name: Ruff — lint
        if: steps.check.outputs.exists == 'true'
        working-directory: services/${{ matrix.service }}
        run: poetry run ruff check . --output-format=github

      - name: Ruff — format check
        if: steps.check.outputs.exists == 'true'
        working-directory: services/${{ matrix.service }}
        run: poetry run ruff format --check . --diff

      - name: mypy — type check
        if: steps.check.outputs.exists == 'true'
        working-directory: services/${{ matrix.service }}
        run: poetry run mypy . --no-error-summary

      - name: bandit — security check
        if: steps.check.outputs.exists == 'true'
        working-directory: services/${{ matrix.service }}
        run: |
          poetry run bandit -r src/ -ll -q || \
            echo "::warning::bandit обнаружил возможные проблемы безопасности"

  # ─── Frontend ────────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend — TypeScript / ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (с submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Проверить наличие package.json
        id: check
        run: |
          if [[ -f "services/frontend/package.json" ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::services/frontend/package.json не найден — пропускаю"
          fi

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: services/frontend/package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.exists == 'true'
        working-directory: services/frontend
        run: npm ci --prefer-offline

      - name: ESLint
        if: steps.check.outputs.exists == 'true'
        working-directory: services/frontend
        run: npx eslint . --ext .ts,.tsx --format=github-actions

      - name: TypeScript — type check
        if: steps.check.outputs.exists == 'true'
        working-directory: services/frontend
        run: npx tsc --noEmit

  # ─── Protobuf ─────────────────────────────────────────────────────────────────
  proto-lint:
    name: Protobuf — buf lint / breaking
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup buf
        uses: bufbuild/buf-setup-action@v1
        with:
          version: latest
          github_token: ${{ github.token }}

      - name: buf lint
        working-directory: proto
        run: buf lint

      - name: buf breaking (только для PR)
        if: github.event_name == 'pull_request'
        working-directory: proto
        run: |
          buf breaking \
            --against "https://github.com/${{ github.repository }}.git#branch=${{ github.base_ref }}"

  # ─── Summary ─────────────────────────────────────────────────────────────────
  lint-summary:
    name: Lint Summary
    runs-on: ubuntu-latest
    needs: [python-lint, frontend-lint, proto-lint]
    if: always()

    steps:
      - name: Проверка результатов
        run: |
          python_result="${{ needs.python-lint.result }}"
          frontend_result="${{ needs.frontend-lint.result }}"
          proto_result="${{ needs.proto-lint.result }}"

          echo "## Результаты Lint & Type Check" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Job | Статус |" >> "$GITHUB_STEP_SUMMARY"
          echo "|-----|--------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Python (matrix) | ${python_result} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend | ${frontend_result} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Protobuf | ${proto_result} |" >> "$GITHUB_STEP_SUMMARY"

          if [[ "$python_result" != "success" && "$python_result" != "skipped" ]] || \
             [[ "$frontend_result" != "success" && "$frontend_result" != "skipped" ]] || \
             [[ "$proto_result" != "success" && "$proto_result" != "skipped" ]]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "❌ Один или несколько проверок завершились с ошибкой" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "✅ Все проверки прошли успешно" >> "$GITHUB_STEP_SUMMARY"
