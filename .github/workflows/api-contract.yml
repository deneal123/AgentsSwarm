name: CI Quality Gates

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "docs/**"
      - ".github/workflows/api-contract.yml"
      - ".pre-commit-config.yaml"
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
      - name: Ruff
        run: ruff check service scripts tests
      - name: Mypy critical packages
        run: mypy
      - name: Complexity guard
        run: python scripts/check_module_complexity.py
      - name: Backend tests with coverage thresholds
        run: pytest
      - name: Generate OpenAPI
        run: python scripts/export_openapi.py --output artifacts/openapi.json
      - name: OpenAPI diff against critical snapshots
        run: python scripts/openapi_snapshot_diff.py
      - name: Validate schema snapshots
        run: pytest tests/test_response_schema_snapshots.py tests/test_critical_endpoint_snapshots.py
      - name: Upload OpenAPI artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-schema
          path: backend/artifacts/openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Frontend tests and snapshots
        run: npm run test -- --watchAll=false --ci --runInBand --updateSnapshot=false
      - name: Critical chat/auth regression gate
        run: npm run test -- --watchAll=false --ci --runInBand tests/unit/features/chat/chatStateContainer.test.js tests/unit/hooks/useChatTransport.test.js tests/integration/chat-flow.test.jsx tests/integration/auth.test.jsx
