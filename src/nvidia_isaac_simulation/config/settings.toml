[default]
version = "v0.0.9"

[default.simulation]
headless = true
stream_resolution = [1920, 1080]
max_framerate = 60
max_bitrate = 10000000
stun_server = "stun:stun.l.google.com:19302"
physics_dt = 0.008333333
rendering_dt = 0.016666667
substeps = 2
use_gpu_physx = true
environment_usd = "Isaac/Environments/Grid/default_environment.usd"
gravity = [0.0, 0.0, -9.81]

[default.robots]
# тип робота: carter (по умолчанию)
type = "nova_carter"
# сколько роботов заспавнить при старте
count = 2
names = ["carter1", "carter2"]
# включать ли ROS-камеры в сцене
enable_cameras = true
# шаг сетки по XY для раскладки роя
spacing = 2.5
# смещение по Z, чтобы роботы не проваливались в землю при загрузке
z_offset = 0.5
