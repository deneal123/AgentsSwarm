syntax = "proto3";

package orchestrator.v1;

option python_package = "orchestrator.v1";

import "common/v1/types.proto";
import "common/v1/telemetry.proto";
import "google/protobuf/timestamp.proto";

// ─── Requests / Responses ─────────────────────────────────────────────────────

message SubmitCommandRequest {
    string user_id      = 1;
    string text         = 2;  // NL команда: "Робот 1, принеси красную коробку"
    int32  priority     = 3;  // 1 (низкий) … 100 (экстренный)
    string trace_id     = 4;
    google.protobuf.Timestamp timestamp = 5;
}

message SubmitCommandResponse {
    string task_id      = 1;
    string message      = 2;  // подтверждение пользователю
    TaskStatus status   = 3;
}

message GetTaskStatusRequest {
    string task_id = 1;
}

message GetTaskStatusResponse {
    string task_id      = 1;
    TaskStatus status   = 2;
    string assigned_robot_id = 3;
    string progress_message  = 4;
    google.protobuf.Timestamp created_at  = 5;
    google.protobuf.Timestamp started_at  = 6;
    google.protobuf.Timestamp finished_at = 7;
    map<string, string> result = 8;
}

message GetRobotStateRequest {
    string robot_id = 1;
}

message GetRobotStateResponse {
    string robot_id     = 1;
    RobotStatus status  = 2;
    common.v1.Position position = 3;
    float battery_level = 4;
    string zone_id      = 5;
    string current_task_id = 6;
    google.protobuf.Timestamp last_seen = 7;
}

message StreamEventsRequest {
    string subscriber_id = 1;
    repeated string event_types = 2;  // фильтр: пусто = все
    repeated string robot_ids   = 3;  // фильтр: пусто = все
}

message SystemEvent {
    string event_id     = 1;
    string event_type   = 2;
    string robot_id     = 3;
    string task_id      = 4;
    Severity severity   = 5;
    string message      = 6;
    map<string, string> payload = 7;
    google.protobuf.Timestamp timestamp = 8;
}

// ─── Service ─────────────────────────────────────────────────────────────────

service OrchestratorService {
    // Принять NL-команду от пользователя (через Gateway)
    rpc SubmitCommand(SubmitCommandRequest) returns (SubmitCommandResponse);

    // Получить статус задачи
    rpc GetTaskStatus(GetTaskStatusRequest) returns (GetTaskStatusResponse);

    // Получить текущее состояние робота
    rpc GetRobotState(GetRobotStateRequest) returns (GetRobotStateResponse);

    // Стриминг системных событий (для Gateway WebSocket)
    rpc StreamEvents(StreamEventsRequest) returns (stream SystemEvent);
}
