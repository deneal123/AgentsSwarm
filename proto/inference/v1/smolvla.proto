syntax = "proto3";

package inference.v1;

option python_package = "inference.v1";

import "google/protobuf/timestamp.proto";

// ─── SmolVLA Service (Vision-Language-Action) ─────────────────────────────────

message JointState {
    repeated float positions   = 1;  // текущие позиции суставов (радианы)
    repeated float velocities  = 2;
    repeated string joint_names = 3;
}

message ActionPoint {
    float dx      = 1;
    float dy      = 2;
    float dz      = 3;
    float d_roll  = 4;
    float d_pitch = 5;
    float d_yaw   = 6;
    float gripper = 7;  // [0=open, 1=closed]
}

message PredictActionRequest {
    repeated bytes images  = 1;   // 1–3 ракурса (JPEG bytes)
    string instruction     = 2;   // текстовая инструкция
    JointState joint_state = 3;   // текущее состояние суставов
    string robot_id        = 4;
    string domain_id       = 5;   // для X-VLA soft prompts
    string model           = 6;   // "smolvla" | "xvla" | ""=auto
    string trace_id        = 7;
}

message ActionChunk {
    repeated ActionPoint actions  = 1;  // N=50 действий
    float    confidence           = 2;  // уверенность модели
    int32    chunk_index          = 3;
    float    processing_time_ms   = 4;
    string   model_used           = 5;
    google.protobuf.Timestamp timestamp = 6;
}

message ModelInfoRequest {
    string model = 1;  // "" = все
}

message ModelInfoResponse {
    string model_id      = 1;
    string version       = 2;
    bool   is_loaded     = 3;
    string device        = 4;
    string dtype         = 5;
    int32  actions_per_chunk = 6;
}

service SmolVLAService {
    // Предсказание action chunk (unary)
    rpc PredictAction(PredictActionRequest) returns (ActionChunk);

    // Потоковый режим: клиент стримит кадры, сервер стримит chunks
    rpc StreamActions(stream PredictActionRequest) returns (stream ActionChunk);

    // Информация о загруженных моделях
    rpc GetModelInfo(ModelInfoRequest) returns (stream ModelInfoResponse);
}
