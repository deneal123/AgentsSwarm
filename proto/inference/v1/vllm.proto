syntax = "proto3";

package inference.v1;

option python_package = "inference.v1";

import "google/protobuf/timestamp.proto";

// ─── vLLM Service ────────────────────────────────────────────────────────────

message Message {
    string role    = 1;  // "system" | "user" | "assistant" | "tool"
    string content = 2;
    bytes  image   = 3;  // base64 или raw bytes для мультимодальных запросов
}

message Tool {
    string name        = 1;
    string description = 2;
    string parameters  = 3;  // JSON Schema
}

message GenerateRequest {
    repeated Message messages = 1;
    string model              = 2;  // "" = дефолтная
    float  temperature        = 3;
    int32  max_tokens         = 4;
    float  top_p              = 5;
    repeated string stop      = 6;
    repeated Tool tools       = 7;
    string response_format    = 8;   // "" | "json_object" | "json_schema"
    string json_schema        = 9;   // JSON Schema для guided decoding
    string lora_adapter       = 10;  // имя LoRA адаптера
    string trace_id           = 11;
}

message ToolCall {
    string id        = 1;
    string name      = 2;
    string arguments = 3;  // JSON
}

message GenerateResponse {
    string content              = 1;
    repeated ToolCall tool_calls = 2;
    string finish_reason        = 3;  // "stop" | "length" | "tool_calls"
    int32  prompt_tokens        = 4;
    int32  completion_tokens    = 5;
    float  processing_time_ms   = 6;
    string model_used           = 7;
}

message TokenResponse {
    string token   = 1;
    bool   is_last = 2;
    string finish_reason = 3;
}

message VisionRequest {
    bytes  image_data = 1;
    string query      = 2;  // текстовый вопрос
    string model      = 3;
    string trace_id   = 4;
}

message AnalysisResponse {
    string description  = 1;  // общее описание сцены
    string objects_json = 2;  // JSON: [{class, position, confidence}]
    string raw_response = 3;
    float  processing_time_ms = 4;
}

service VLLMService {
    // Генерация текста (non-streaming)
    rpc Generate(GenerateRequest) returns (GenerateResponse);

    // Потоковая генерация (токен за токеном)
    rpc StreamGenerate(GenerateRequest) returns (stream TokenResponse);

    // Мультимодальный анализ изображения
    rpc AnalyzeImage(VisionRequest) returns (AnalysisResponse);
}
