syntax = "proto3";

package common.v1;

option python_package = "common.v1";

import "google/protobuf/timestamp.proto";

// ─── Enums ────────────────────────────────────────────────────────────────────

enum RobotStatus {
    ROBOT_STATUS_UNSPECIFIED = 0;
    ROBOT_STATUS_IDLE        = 1;
    ROBOT_STATUS_MOVING      = 2;
    ROBOT_STATUS_EXECUTING   = 3;
    ROBOT_STATUS_CHARGING    = 4;
    ROBOT_STATUS_ERROR       = 5;
    ROBOT_STATUS_OFFLINE     = 6;
    ROBOT_STATUS_MAINTENANCE = 7;
}

enum TaskStatus {
    TASK_STATUS_UNSPECIFIED  = 0;
    TASK_STATUS_PENDING      = 1;
    TASK_STATUS_ASSIGNED     = 2;
    TASK_STATUS_IN_PROGRESS  = 3;
    TASK_STATUS_COMPLETED    = 4;
    TASK_STATUS_FAILED       = 5;
    TASK_STATUS_CANCELLED    = 6;
}

enum Severity {
    SEVERITY_UNSPECIFIED = 0;
    SEVERITY_LOW         = 1;
    SEVERITY_MEDIUM      = 2;
    SEVERITY_HIGH        = 3;
    SEVERITY_CRITICAL    = 4;
}

enum CommandType {
    COMMAND_TYPE_UNSPECIFIED    = 0;
    COMMAND_TYPE_MOVE_TO        = 1;
    COMMAND_TYPE_PICK_UP        = 2;
    COMMAND_TYPE_PUT_DOWN       = 3;
    COMMAND_TYPE_SCAN           = 4;
    COMMAND_TYPE_STOP           = 5;
    COMMAND_TYPE_EMERGENCY_STOP = 6;
    COMMAND_TYPE_UPDATE_CONFIG  = 7;
    COMMAND_TYPE_UPDATE_MODEL   = 8;
    COMMAND_TYPE_INSPECT        = 9;
}

// ─── Spatial ──────────────────────────────────────────────────────────────────

message Position {
    float x   = 1;  // метры
    float y   = 2;
    float z   = 3;
    float orientation_x = 4;  // кватернион
    float orientation_y = 5;
    float orientation_z = 6;
    float orientation_w = 7;
    string frame_id = 8;  // "map" | "odom" | "base_link"
}

message BoundingBox {
    float x_min = 1;  // пиксели
    float y_min = 2;
    float x_max = 3;
    float y_max = 4;
}

message BoundingBoxNorm {
    float x_min = 1;  // нормализованные [0,1]
    float y_min = 2;
    float x_max = 3;
    float y_max = 4;
}

// ─── Common wrapper ───────────────────────────────────────────────────────────

message Timestamp {
    google.protobuf.Timestamp ts = 1;
}
