[project]
name = "pushi-backend-morda"
version = "0.0.1"
description = "Pushi Backend Morda - for the research and development of rules for identifying risks in advertising communications"
authors = ["Volkhin Danil DFVolkhin@sberbank.ru"]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic[email]>=2.11.7,<3.0.0",
    "pydantic-settings>=2.10.1,<3.0.0",
    "pyjwt>=2.10.1,<3.0.0",
    "uvicorn==0.22.0",
    "python-dotenv>=0.9.9,<2.0.0",
    "sqlalchemy>=2.0.43,<3.0.0",
    "alembic>=1.16.4,<2.0.0",
    "asyncpg>=0.30.0,<0.31.0",
    "argon2-cffi>=25.1.0,<26.0.0",
    "httpx>=0.27.0,<0.28.0",
    "minio>=7.2.0,<8.0.0",
    "redis>=5.0.1,<6.0.0",
    "celery[redis]>=5.4.0,<6.0.0",
    "kombu>=5.4.0,<6.0.0",
    "setuptools>=80.0.0",
    "openpyxl>=3.1.2,<4.0.0",
    "fastapi==0.100.0",
    "pushi",
    "dynaconf>=3.2.12",
    "python-multipart>=0.0.22",
    "cachetools>=7.0.1",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pre-commit>=4.3.0",
    "faker>=40.1.0",
    "factory-boy>=3.3.3",
    "pytest>=8.3.3,<9.0.0",
    "pytest-asyncio>=0.23.0,<1.0.0",
    "pytest-mock>=3.15.1",
    "flake8>=6.0.0",
    "mypy>=1.9.0",
    "aiosqlite>=0.22.1,<0.23.0",
]

[tool.uv.sources]
pushi = { git = "https://gitlab.gigalegal.space/rnd/pushi.git", rev = "dev" }
