[tool:pytest]
# Test discovery and execution
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    --strict-markers
    --strict-config
    --disable-warnings
    --tb=short
    --cov=service
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=80
asyncio_mode = auto

# Markers for different test types
markers =
    unit: fast unit tests (deselect with '-m "not unit"')
    integration: integration tests requiring external services (deselect with '-m "not integration"')
    e2e: end-to-end tests (deselect with '-m "not e2e"')
    slow: slow tests (>5s) (deselect with '-m "not slow"')
    performance: performance tests and benchmarks (deselect with '-m "not performance"')
    security: security tests (deselect with '-m "not security"')

# Coverage configuration
[coverage:run]
source = service
omit =
    */tests/*
    */venv/*
    */__pycache__/*
    */migrations/*
    */alembic/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod

# Filter warnings
filterwarnings =
    ignore:Using extra keyword arguments on `Field` is deprecated.*
    ignore:pkg_resources is deprecated as an API.*
    ignore:.*HTTP_422_UNPROCESSABLE_ENTITY.*
    ignore::DeprecationWarning:starlette.*
    ignore::UserWarning:stopit.*
