[tool.poetry]
name = "gateway-service"
version = "0.1.0"
description = "AgentsSwarm — API Gateway: REST, WebSocket, JWT auth, routing to internal services"
authors = ["AgentsSwarm Team"]
readme = "README.md"
packages = [{ include = "gateway_service", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"

# Web framework
fastapi = "^0.115.0"
uvicorn = { version = "^0.32.0", extras = ["standard"] }

# Config
pydantic-settings = "^2.6.0"
pydantic = { version = "^2.10.0", extras = ["email"] }

# Auth
python-jose = { version = "^3.3.0", extras = ["cryptography"] }
passlib = { version = "^1.7.4", extras = ["bcrypt"] }

# Message broker
aio-pika = "^9.4.0"

# Cache / Pub-Sub
redis = { version = "^5.2.0", extras = ["hiredis"] }

# gRPC
grpcio = "^1.68.0"
grpcio-tools = "^1.68.0"
protobuf = "^5.28.0"

# HTTP client (internal calls)
httpx = "^0.28.0"

# Serialization
orjson = "^3.10.0"
msgpack = "^1.1.0"

# Observability
structlog = "^24.4.0"
opentelemetry-api = "^1.28.0"
opentelemetry-sdk = "^1.28.0"
opentelemetry-instrumentation-fastapi = "^0.49b0"
opentelemetry-exporter-otlp = "^1.28.0"
prometheus-client = "^0.21.0"

# Utils
python-multipart = "^0.0.18"
websockets = "^14.1"

[tool.poetry.group.dev.dependencies]
# Testing
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^6.0.0"
httpx = "^0.28.0"
respx = "^0.21.0"
fakeredis = { version = "^2.26.0", extras = ["aioredis"] }

# Linting
ruff = "^0.8.0"
mypy = "^1.13.0"
bandit = { version = "^1.8.0", extras = ["toml"] }

# Types
types-redis = "^4.6.0"
types-passlib = "^1.7.7"
types-python-jose = "^3.3.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# ─── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "ARG",  # flake8-unused-arguments
    "SIM",  # flake8-simplify
    "TID",  # flake8-tidy-imports
    "RUF",  # Ruff-specific
    "S",    # bandit (security)
    "ANN",  # annotations
]
ignore = [
    "ANN101",  # missing type annotation for self
    "ANN102",  # missing type annotation for cls
    "S104",    # hardcoded bind all interfaces (0.0.0.0 — нормально для Docker)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["gateway_service"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ─── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --cov=src/gateway_service --cov-report=term-missing --cov-fail-under=71"
filterwarnings = ["error", "ignore::DeprecationWarning"]

# ─── coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/gateway_service"]
omit = ["*/__init__.py", "*/monitoring/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# ─── bandit ───────────────────────────────────────────────────────────────────
[tool.bandit]
targets = ["src"]
skips = ["B104"]  # bind to 0.0.0.0 — нормально для Docker
