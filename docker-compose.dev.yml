# ==============================================================================
# AgentsSwarm — Docker Compose (Development)
# ==============================================================================
# Profiles:
#   default     — infra + brokers + app services
#   gpu         — AI inference services (vLLM)
#
# Usage:
#   make up                               # default profile
#   make up-gpu                           # default + gpu
#   docker compose -f docker-compose.dev.yml --profile gpu up -d
# ==============================================================================

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "3"

x-python-service: &python-service
  restart: unless-stopped
  logging: *default-logging
  networks:
    - swarm-net

networks:
  swarm-net:
    driver: bridge
    name: agentsswarm_dev
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres_data:
    name: agentsswarm_postgres_data
  redis_data:
    name: agentsswarm_redis_data
  minio_data:
    name: agentsswarm_minio_data
  rabbitmq_data:
    name: agentsswarm_rabbitmq_data

