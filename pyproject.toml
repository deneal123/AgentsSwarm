[project]
name = "vllm_service"
version = "v0.0.1"
description = "OpenAI-compatible API server with Data Parallel support"
authors = [
    { name = "GravyTalk", email = "deneaL123@mail.ru" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "vllm>=0.6.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "openai>=1.0.0",
    "dynaconf>=3.0.0",
]

[project.scripts]
vllm-service = "vllm_service.cli:main"

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pre-commit>=4.3.0",
    "build>=1.4.0,<2.0.0",
    "twine>=6.2.0,<7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vllm_service"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 88