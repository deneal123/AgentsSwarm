[project]
name = "orchestrator"
version = "v0.0.1"
description = ""
authors = [
    { name = "GravyTalk", email = "deneal123@mail.ru" }
]
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "dynaconf>=3.2.0",
    "redis>=5.0.0",
    "openai-agents>=0.4.0",
    "openai>=1.55.3",
    "httpx>=0.27.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=25.1.0",
    "isort>=6.0.1",
    "pre-commit>=4.3.0",
    "build>=1.4.0,<2.0.0",
    "twine>=6.2.0,<7.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[[tool.uv.index]]
name = "simple"
url = "https://pypi.org/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.hatch.build]
include = [
    "*.yaml",
    "*.toml",
    "*.crt",
]
