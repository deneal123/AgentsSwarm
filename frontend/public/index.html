<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050505" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />

    <!-- SEO Meta Tags -->
    <meta name="description" content="GPTHub — AI Workspace для команд и личных задач" />
    <meta name="keywords" content="AI, GPT, Chatbot, Orchestrator" />
    <meta name="author" content="GPTHub" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Social Media -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="GPTHub — AI Workspace" />
    <meta property="og:description" content="GPTHub — AI Workspace для команд и личных задач" />
    <meta property="og:image" content="%PUBLIC_URL%/favicon-256x256.png" />
    <meta property="og:url" content="https://gpthub.incellcorp.ru" />
    <meta property="og:locale" content="ru_RU" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GPTHub — AI Workspace" />
    <meta name="twitter:description" content="GPTHub — AI Workspace для команд и личных задач" />

    <!-- Preconnect для ускорения загрузки шрифтов -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <!-- DNS prefetch как fallback -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <!-- Preconnect для API (замените на актуальный URL при деплое) -->
    <link rel="dns-prefetch" href="//185.55.57.82" />

    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon-gpthub.svg?v=2" />
    <link rel="shortcut icon" href="%PUBLIC_URL%/favicon-gpthub.svg?v=2" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="GPTHub" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!-- Оптимизированная загрузка шрифтов: только нужные веса, display=swap для FOUT вместо FOIT -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap&subset=cyrillic,latin"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap&subset=cyrillic,latin"
        rel="stylesheet"
      />
    </noscript>
    <title>GPTHub — AI Workspace</title>
    <style>
      html, body {
        font-size: 16px;
        margin: 0;
        padding: 0;
        font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
        background: #080808;
        color: #f0f0f0;
      }
      #root {
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      * { box-sizing: border-box; }
      ::selection { background: rgba(239, 68, 68, 0.22); color: inherit; }
      ::-moz-selection { background: rgba(239, 68, 68, 0.22); color: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
