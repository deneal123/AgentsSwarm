## ===========================================================================
## EMQX 5.x Configuration for AgentsSwarm (Development)
## Format: HOCON
## ===========================================================================

## ─── Node ───────────────────────────────────────────────────────────────────
node {
  name = "emqx@agentsswarm-emqx"
  cookie = "agentsswarm-emqx-dev-cookie"
  data_dir = "/opt/emqx/data"
}

## ─── Cluster ─────────────────────────────────────────────────────────────────
cluster {
  name = agentsswarm
  discovery_strategy = manual
}

## ─── Dashboard ───────────────────────────────────────────────────────────────
dashboard {
  listeners.http {
    bind = 18083
  }
  default_username = "admin"
  # default_password set via EMQX_DASHBOARD__DEFAULT_PASSWORD env var
}

## ─── Listeners ───────────────────────────────────────────────────────────────
listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 100000
  tcp_options {
    backlog = 1024
    send_timeout = 15s
    send_timeout_close = true
    nodelay = true
  }
}

listeners.ws.default {
  bind = "0.0.0.0:8083"
  max_connections = 10000
  websocket.mqtt_path = "/mqtt"
}

listeners.wss.default {
  bind = "0.0.0.0:8084"
  max_connections = 10000
  websocket.mqtt_path = "/mqtt"
}

## ─── MQTT ────────────────────────────────────────────────────────────────────
mqtt {
  max_packet_size = 1MB
  idle_timeout = 30s
  max_topic_levels = 10
  max_qos_allowed = 2
  retain_available = true
  wildcard_subscription = true
  shared_subscription = true
  # Keep alive: client sets; we allow up to 300s
  keepalive_check_interval = 30s
}

## ─── Authentication (dev: allow all) ─────────────────────────────────────────
## In production: configure MQTT username/password or X.509 certificates
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
  }
]

## ─── Authorization ───────────────────────────────────────────────────────────
authorization {
  ## In dev: allow all. In prod: switch to file or built_in_database
  no_match = allow
  deny_action = ignore
  cache {
    enable = true
    max_size = 32
    ttl = 1m
  }
  sources = []
}

## ─── Retainer ────────────────────────────────────────────────────────────────
retainer {
  enable = true
  msg_expiry_interval = 24h
  max_payload_size = 1MB
  backend {
    type = built_in_database
    storage_type = ram
    max_retained_messages = 10000
  }
}

## ─── Broker ──────────────────────────────────────────────────────────────────
broker {
  sys_interval = 1m
  sys_heartbeat = 30s
  enable_session_registry = true
  session_locking_strategy = quorum
  shared_subscription_strategy = round_robin
  # LWT message handling
  # Robots publish LWT to: status/{robot_id}/connection
}

## ─── Log ─────────────────────────────────────────────────────────────────────
log {
  file {
    enable = true
    level = warning
    path = "/opt/emqx/log/emqx.log"
    rotation {
      enable = true
      count = 5
    }
    rotation_size = 50MB
  }
  console {
    enable = true
    level = warning
  }
}

## ─── Metrics ─────────────────────────────────────────────────────────────────
prometheus {
  enable = true
  interval = 15s
  # Accessible at http://emqx:18083/api/v5/prometheus/stats
}
