# =============================================================================
# infrastructure/redis/redis.conf
# Конфигурация Redis Stack 7.4 для AgentsSwarm
#
# Используется в docker-compose как:
#   REDIS_ARGS: "--requirepass <password> --include /usr/local/etc/redis/redis.conf"
#   volumes:
#     - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
#
# Redis Stack автоматически подгружает модули:
#   - RedisJSON  (path: /opt/redis-stack/lib/librejson.so)
#   - RediSearch (path: /opt/redis-stack/lib/libresearch.so)
#   - RedisTimeSeries (path: /opt/redis-stack/lib/redistimeseries.so)
#   - RedisBloom, RedisGraph — не используются, оставлены по умолчанию
#
# ВНИМАНИЕ: НЕ указывать loadmodule здесь — образ redis-stack загружает
# их через /etc/redis-stack.conf автоматически.
# =============================================================================

# ─── Сетевые настройки ────────────────────────────────────────────────────────
bind 0.0.0.0
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ─── Общие настройки ──────────────────────────────────────────────────────────
loglevel notice
databases 16
# Уменьшаем отпечаток памяти при старте
dynamic-hz yes
aof-use-rdb-preamble yes

# ─── Снапшоты (RDB) ──────────────────────────────────────────────────────────
# Сохранять снапшот если за 3600s изменилось >= 1 ключ
save 3600 1
# Сохранять снапшот если за 300s изменилось >= 100 ключей
save 300 100
# Сохранять снапшот если за 60s изменилось >= 1000 ключей
save 60 1000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# ─── AOF (Append Only File) — надёжная запись ─────────────────────────────────
appendonly yes
appendfilename "appendonly.aof"
# everysec — баланс между производительностью и надёжностью (потеря < 1s)
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-rewrite-incremental-fsync yes

# ─── Управление памятью ───────────────────────────────────────────────────────
maxmemory 2gb
# allkeys-lru: удалять наименее используемые ключи при нехватке памяти.
# Подходит для Feature Store, где данные могут вытесняться.
maxmemory-policy allkeys-lru
maxmemory-samples 10
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes

# ─── Медленные запросы ────────────────────────────────────────────────────────
slowlog-log-slower-than 10000
slowlog-max-len 128

# ─── Latency monitoring ───────────────────────────────────────────────────────
latency-monitor-threshold 100

# ─── Клиентский вывод ─────────────────────────────────────────────────────────
# Отключаем output buffer limit для pubsub-клиентов (MQTT bridge)
# Значение: normal <hard_limit> <soft_limit> <soft_seconds>
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit pubsub 256mb 64mb 60
client-output-buffer-limit replica 256mb 64mb 60

# ─── RediSearch конфигурация ──────────────────────────────────────────────────
# Настройки применяются через MODULE LOADEX либо через redis-cli FT.CONFIG SET
# Здесь задаём параметры, применяемые через REDIS_ARGS при старте контейнера.
# Все FT.CONFIG SET выполняются в infrastructure/scripts/init-db.sh

# ─── RedisTimeSeries конфигурация ─────────────────────────────────────────────
# Retention по умолчанию для новых time-series ключей (0 = бессрочно)
# Переопределяется при создании ключа через TS.CREATE ... RETENTION <ms>

# ─── Replica настройки (для продакшн-кластера) ───────────────────────────────
# replica-serve-stale-data yes
# replica-read-only yes
# repl-diskless-sync yes
# repl-diskless-sync-delay 5

# ─── Cluster (для prod — раскомментировать) ───────────────────────────────────
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 5000
