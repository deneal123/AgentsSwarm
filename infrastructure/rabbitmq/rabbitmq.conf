# RabbitMQ Configuration for AgentsSwarm
# Loaded via volume mount to /etc/rabbitmq/rabbitmq.conf

## ─── Core ────────────────────────────────────────────────────────────────────
# Load pre-defined exchanges, queues, bindings, and policies from JSON
load_definitions = /etc/rabbitmq/definitions.json

## ─── Networking ──────────────────────────────────────────────────────────────
listeners.tcp.default = 5672
# Allow connections from any IP (Docker internal network)
tcp_listen_options.backlog    = 256
tcp_listen_options.nodelay    = true
tcp_listen_options.sndbuf     = 196608
tcp_listen_options.recbuf     = 196608

## ─── Management Plugin ───────────────────────────────────────────────────────
management.tcp.port             = 15672
management.load_definitions     = /etc/rabbitmq/definitions.json
management.rates_mode           = basic

## ─── Resource Limits ─────────────────────────────────────────────────────────
# Stop publishing when RAM usage exceeds 60% of total
vm_memory_high_watermark.relative = 0.6
# Stop publishing when disk space drops below 1.5x the RAM high watermark
disk_free_limit.relative = 1.5

## ─── Consumer Timeout ────────────────────────────────────────────────────────
# Prevent consumer timeout for long-running tasks (1 hour)
consumer_timeout = 3600000

## ─── Heartbeat ───────────────────────────────────────────────────────────────
heartbeat = 60

## ─── Logging ─────────────────────────────────────────────────────────────────
log.console          = true
log.console.level    = info
log.file.level       = warning
