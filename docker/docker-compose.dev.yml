services:
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orchestrator-dev
    ports:
      - "8000:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      RELOAD: "1"
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ../src/orchestrator/config/.env.example
    volumes:
      - ../:/app:delegated
      # Persist the virtualenv separately so it is not overwritten by the bind mount
      - orchestrator-venv:/app/.venv
    command: uv run uvicorn orchestrator.app:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: orchestrator-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

volumes:
  orchestrator-venv:
  redis-data:
