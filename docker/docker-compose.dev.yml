services:
  # ─────────────────────────────────────────────────────────────
  # Mission Control MCP  (wraps ${MISSION_CONTROL_URL})
  # SSE endpoint inside Docker network: http://mission-control-mcp:8000/sse
  # Exposed on host for debugging: http://localhost:${MISSION_CONTROL_HOST_PORT}/sse
  # ─────────────────────────────────────────────────────────────
  mission-control-mcp:
    build:
      context: ./mission-control-mcp
      dockerfile: Dockerfile
    container_name: mission-control-mcp
    ports:
      - "${MISSION_CONTROL_HOST_PORT:-8010}:8000"
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MISSION_CONTROL_URL: "${MISSION_CONTROL_URL:-http://localhost:8050}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # Mission Dispatch MCP  (wraps ${MISSION_DISPATCH_URL})
  # SSE endpoint inside Docker network: http://mission-dispatch-mcp:8000/sse
  # Exposed on host for debugging: http://localhost:${MISSION_DISPATCH_HOST_PORT}/sse
  # ─────────────────────────────────────────────────────────────
  mission-dispatch-mcp:
    build:
      context: ./mission-dispatch-mcp
      dockerfile: Dockerfile
    container_name: mission-dispatch-mcp
    ports:
      - "${MISSION_DISPATCH_HOST_PORT:-8011}:8000"
    environment:
      MCP_TRANSPORT: sse
      MCP_HOST: 0.0.0.0
      MCP_PORT: "8000"
      MISSION_DISPATCH_URL: "${MISSION_DISPATCH_URL:-http://localhost:8051}"
      MISSION_DISPATCH_TIMEOUT: "${MISSION_DISPATCH_TIMEOUT:-3600}"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # ROS MSP  (rosbridge WebSocket → MCP via FastMCP streamable-http transport)
  # MCP endpoint inside Docker network: http://ros-msp:8000/mcp
  # Exposed on host for debugging: http://localhost:${ROS_MSP_HOST_PORT}/mcp
  # Set ROSBRIDGE_IP to the actual robot/simulator IP in docker/.env
  # ─────────────────────────────────────────────────────────────
  ros-msp:
    build:
      context: ./ros-msp
      dockerfile: Dockerfile
    container_name: ros-msp
    ports:
      - "${ROS_MSP_HOST_PORT:-8012}:8000"
    environment:
      ROSBRIDGE_IP: "${ROSBRIDGE_IP:-127.0.0.1}"
      ROSBRIDGE_PORT: "${ROSBRIDGE_PORT:-9090}"
      ROS_DEFAULT_TIMEOUT: "5.0"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import socket; s=socket.create_connection(('localhost',8000),2); s.close()"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3

  # ─────────────────────────────────────────────────────────────
  # Orchestrator
  # ─────────────────────────────────────────────────────────────
  orchestrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: orchestrator-dev
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    environment:
      HOST: 0.0.0.0
      RELOAD: "1"
      REDIS_URL: redis://redis:6379/0
      # MCP transport: always sse/streamable-http in Docker (overrides env_file stdio defaults)
      MISSION_CONTROL_TRANSPORT: sse
      MISSION_CONTROL_MCP_URL: http://mission-control-mcp:8000/sse
      MISSION_DISPATCH_TRANSPORT: sse
      MISSION_DISPATCH_MCP_URL: http://mission-dispatch-mcp:8000/sse
      ROS_MSP_TRANSPORT: streamable-http
      ROS_MSP_MCP_URL: http://ros-msp:8000/mcp
      # Enable real Agents SDK in Docker (overrides AGENTS_USE_SDK=0 from env_file)
      AGENTS_USE_SDK: "1"
      # Direct Mission Control URL for map image fetching (MapAnalyst)
      MISSION_CONTROL_URL: "${MISSION_CONTROL_URL:-http://localhost:8050}"
    env_file:
      # env_file values are overridden by the environment block above.
      # Edit this file for: AGENTS_MODEL, AGENTS_PROVIDER, OPENAI_API_KEY,
      # VLLM_BASE_URL, OPENROUTER_API_KEY, AGENTS_TEMPERATURE, PLAN_REPLAN_MAX, etc.
      - ../src/orchestrator/config/.env
    volumes:
      - ../:/app:delegated
      - orchestrator-venv:/app/.venv
    command: sh -c "uv run uvicorn orchestrator.app:app --host $${HOST:-0.0.0.0} --port $${PORT:-8000} --reload"
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_started
      mission-control-mcp:
        condition: service_healthy
      mission-dispatch-mcp:
        condition: service_healthy
      ros-msp:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────
  # Redis
  # ─────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: orchestrator-redis
    # Port not exposed to host — Redis on the host likely uses 6379 already.
    # Inside Docker network orchestrator connects via redis:6379.
    volumes:
      - redis-data:/data
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]

volumes:
  orchestrator-venv:
  redis-data:
