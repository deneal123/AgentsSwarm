[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ros-msp"
version = "1.0.0"
description = "MCP server for ROS robot control and monitoring via rosbridge WebSocket"
authors = [
    {name = "ROS MCP Team"},
]
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "websockets>=12.0",
    "Pillow>=10.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = []

[project.scripts]
ros-msp = "ros_mcp.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ros_mcp*"]
