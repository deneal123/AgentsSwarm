services:
  vda5050-client:
    image: isaac_sim_ros:ubuntu_24_jazzy
    container_name: vda5050_client
    network_mode: "host"
    ipc: host
    environment:
      - ROS_DISTRO=jazzy
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_fastrtps_cpp
      - FASTRTPS_DEFAULT_PROFILES_FILE=/jazzy_ws/fastdds.xml
      - ROS_AUTOMATIC_DISCOVERY_RANGE=SUBNET
    volumes:
      - /root/projects/workspace_isaac_simulation/IsaacSim-ros_workspaces/build_ws/jazzy/isaac_sim_ros_ws:/jazzy_ws:ro
      - /root/projects:/workspace/projects:ro
      - /root/projects/isaac_mission_control/docker/config/uploaded_maps:/workspace/maps:ro
      - /root/projects/isaac_mission_control/docker/config/nav2_params_custom.yaml:/workspace/nav2_params_custom.yaml:ro
      - ./scripts/entrypoint.sh:/entrypoint.sh:ro
    stdin_open: true
    tty: true
    entrypoint: /entrypoint.sh
    restart: unless-stopped
