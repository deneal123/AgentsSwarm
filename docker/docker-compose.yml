services:
  vllm-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vllm-service:latest
    container_name: ${VLLM_CONTAINER_NAME:-vllm-service}
    hostname: ${VLLM_HOSTNAME:-vllm-service}
    ipc: ${VLLM_IPC_MODE:-host}
    ports:
      - "${VLLM_PORT:-8073}:8073"  # vLLM обычно использует 8073
    env_file: 
      - ../src/vllm_service/config/.env
    entrypoint: ["./entrypoint.sh"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:-1}
              capabilities: [gpu]
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - model-cache:/root/.cache/model
      - ../src:/app/src  # Для hot reload (опционально в dev режиме)
    ulimits:
      memlock: -1
      stack: 67108864
    restart: unless-stopped

volumes:
  huggingface-cache:
  model-cache:
