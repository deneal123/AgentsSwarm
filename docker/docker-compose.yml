
services:
  vllm-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vllm-service:latest
    container_name: ${VLLM_CONTAINER_NAME:-vllm-service}
    hostname: ${VLLM_HOSTNAME:-vllm-service}
    network_mode: ${VLLM_NETWORK_MODE:-host}
    ipc: ${VLLM_IPC_MODE:-host}
    ports:
      - "${VLLM_PORT:-8000}:8000"
    env_file: 
      - ../src/vllm_service/config/.env

    # Headless mode for worker nodes (rank > 0)
    command: >
      sh -c "
        if [ \"$VLLM_DATA_PARALLEL_RANK\" = \"0\" ]; then
          vllm-service serve
        else
          vllm-service serve --headless
        fi
      "
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:-1}
              capabilities: [gpu]
    
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - model-cache:/root/.cache/model
      # Mount source code for hot reload (dev mode)
      - ../src:/app/src
    
    ulimits:
      memlock: -1
      stack: 67108864

    restart: unless-stopped

volumes:
  huggingface-cache:
  model-cache:
