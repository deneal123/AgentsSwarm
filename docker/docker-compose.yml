services:
  mosquitto:
    image: ${MOSQUITTO_IMAGE}
    command:
      - /bin/sh
      - -c
      - |
        echo "allow_anonymous true" > mosquitto.conf
        echo "listener ${MQTT_PORT_TCP} 0.0.0.0" >> mosquitto.conf
        echo "listener ${MQTT_PORT_WEBSOCKET}" >> mosquitto.conf
        echo "protocol websockets" >> mosquitto.conf
        mosquitto -c mosquitto.conf
    network_mode: "host"

  postgres:
    image: ${POSTGRES_IMAGE}
    environment:
      - POSTGRES_USER=${POSTGRES_DATABASE_USERNAME}
      - POSTGRES_PASSWORD=${POSTGRES_DATABASE_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DATABASE_NAME}
      - POSTGRES_INITDB_ARGS=--auth-host=scram-sha-256 --auth-local=scram-sha-256
    ports:
      - "${POSTGRES_DATABASE_PORT}:${POSTGRES_DATABASE_PORT}"
    network_mode: "host"
    volumes:
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_DATABASE_USERNAME}"]
      interval: 3s
      timeout: 5s
      retries: 5

  mission-database:
    image: ${MISSION_DATABASE_IMAGE}
    command:
      [
        "--address",
        "0.0.0.0",
        "--port",
        "${DATABASE_API_PORT}",
        "--controller_port",
        "${DATABASE_CONTROLLER_PORT}",
        "--db_port",
        "${POSTGRES_DATABASE_PORT}",
        "--db_name",
        "${POSTGRES_DATABASE_NAME}",
        "--db_username",
        "${POSTGRES_DATABASE_USERNAME}",
        "--db_password",
        "${POSTGRES_DATABASE_PASSWORD}",
      ]
    network_mode: "host"
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${DATABASE_API_PORT}/health || exit 1"]
      interval: 300s
      timeout: 5s
      retries: 6
      start_period: 10s

  mission-dispatch:
    image: ${MISSION_DISPATCH_IMAGE:-isaac-mission-dispatch}
    build:
      context: ..
      dockerfile: docker/Dockerfile.dispatch
      network: host
    command:
      [
        "--mqtt_port",
        "${MQTT_PORT_WEBSOCKET}",
        "--mqtt_transport",
        "${MQTT_TRANSPORT}",
        "--database_url",
        "http://${MISSION_DISPATCH_HOST:-localhost}:${DATABASE_CONTROLLER_PORT}",
      ]
    network_mode: "host"
    depends_on:
      postgres:
        condition: service_healthy
      mission-database:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:${DATABASE_CONTROLLER_PORT}/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s


