# Docker Compose for vLLM Service
# Single-node or Data Parallel deployment
# 
# Usage:
#   Single node:     docker-compose up -d
#   Data Parallel:  docker-compose up -d (configure via .env)
#
# Configure via .env file before running

version: '3.8'

services:
  vllm-service:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: vllm-service:latest
    container_name: ${VLLM_CONTAINER_NAME:-vllm-service}
    hostname: ${VLLM_HOSTNAME:-vllm-service}
    
    # Use host network for Data Parallel (required for ZMQ)
    network_mode: ${VLLM_NETWORK_MODE:-host}
    ipc: ${VLLM_IPC_MODE:-host}

    ports:
      - "${VLLM_PORT:-8000}:8000"
    
    environment:
      # Model Configuration
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}
      - VLLM_MODEL_DTYPE=${VLLM_MODEL_DTYPE:-auto}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-4096}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.9}
      
      # Server Configuration
      - VLLM_HOST=0.0.0.0
      - VLLM_PORT=8000
      - VLLM_API_KEY=${VLLM_API_KEY:-}
      
      # Data Parallel Configuration
      # VLLM_DATA_PARALLEL_SIZE=1  -> single node (default)
      # VLLM_DATA_PARALLEL_SIZE=2  -> DP cluster
      - VLLM_DATA_PARALLEL_SIZE=${VLLM_DATA_PARALLEL_SIZE:-1}
      - VLLM_DATA_PARALLEL_RANK=${VLLM_DATA_PARALLEL_RANK:-0}
      - VLLM_DATA_PARALLEL_ADDRESS=${VLLM_DATA_PARALLEL_ADDRESS:-localhost}
      - VLLM_DATA_PARALLEL_RPC_PORT=${VLLM_DATA_PARALLEL_RPC_PORT:-13345}
      - VLLM_DATA_PARALLEL_SIZE_LOCAL=${VLLM_DATA_PARALLEL_SIZE_LOCAL:-1}
      
      # Engine Configuration
      - VLLM_TENSOR_PARALLEL_SIZE=${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - VLLM_MAX_NUM_SEQS=${VLLM_MAX_NUM_SEQS:-256}
      - VLLM_MAX_NUM_BATCHED_TOKENS=${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}
      
      # Logging
      - VLLM_LOG_LEVEL=${VLLM_LOG_LEVEL:-INFO}
    
      # CUDA device
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}

    # Headless mode for worker nodes (rank > 0)
    command: >
      sh -c "
        if [ \"$VLLM_DATA_PARALLEL_RANK\" = \"0\" ]; then
          vllm-service serve
        else
          vllm-service serve --headless
        fi
      "
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${VLLM_GPU_COUNT:-1}
              capabilities: [gpu]
    
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - model-cache:/root/.cache/model
      # Mount source code for hot reload (dev mode)
      - ../src:/app/src
    
    ulimits:
      memlock: -1
      stack: 67108864

    restart: unless-stopped

volumes:
  huggingface-cache:
  model-cache:
