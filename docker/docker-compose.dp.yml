# Docker Compose for vLLM Data Parallel (2 nodes on same machine)
# Usage:
#   Node 0: docker-compose -f docker-compose.dp.yml up -d vllm-node0
#   Node 1: docker-compose -f docker-compose.dp.yml up -d vllm-node1
#
# Prerequisites:
#   - Set VLLM_DP_MASTER_IP to your machine's local IP (e.g., 192.168.1.100)
#   - Model must be accessible on both nodes

version: '3.8'

services:
  vllm-node0:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vllm-node0
    hostname: vllm-node0
    # Use host network for DP communication
    network_mode: host
    # IPC host required for ZMQ/DP communication
    ipc: host
    ports:
      - "8000:8000"
    environment:
      # Model Configuration
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}
      - VLLM_MODEL_DTYPE=${VLLM_MODEL_DTYPE:-auto}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-4096}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.9}

      # Server Configuration
      - VLLM_HOST=0.0.0.0
      - VLLM_PORT=8000
      - VLLM_API_KEY=${VLLM_API_KEY:-}

      # Data Parallel Configuration - NODE 0 (Coordinator)
      - VLLM_DATA_PARALLEL_SIZE=${VLLM_DATA_PARALLEL_SIZE:-2}
      - VLLM_DATA_PARALLEL_RANK=0
      - VLLM_DATA_PARALLEL_ADDRESS=${VLLM_DP_MASTER_IP:-192.168.1.100}
      - VLLM_DATA_PARALLEL_RPC_PORT=${VLLM_DP_PORT:-13345}
      - VLLM_DATA_PARALLEL_SIZE_LOCAL=1

      # Engine Configuration
      - VLLM_TENSOR_PARALLEL_SIZE=1
      - VLLM_MAX_NUM_SEQS=${VLLM_MAX_NUM_SEQS:-256}
      - VLLM_MAX_NUM_BATCHED_TOKENS=${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}

      # Logging
      - VLLM_LOG_LEVEL=${VLLM_LOG_LEVEL:-INFO}

      # CUDA device
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - model-cache:/root/.cache/model

    ulimits:
      memlock: -1
      stack: 67108864

    restart: unless-stopped

  vllm-node1:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: vllm-node1
    hostname: vllm-node1
    # Use host network for DP communication
    network_mode: host
    # IPC host required for ZMQ/DP communication
    ipc: host
    ports:
      - "8001:8000"
    environment:
      # Model Configuration
      - VLLM_MODEL_NAME=${VLLM_MODEL_NAME:-Qwen/Qwen2.5-7B-Instruct}
      - VLLM_MODEL_DTYPE=${VLLM_MODEL_DTYPE:-auto}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-4096}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.9}

      # Server Configuration
      - VLLM_HOST=0.0.0.0
      - VLLM_PORT=8000
      - VLLM_API_KEY=${VLLM_API_KEY:-}

      # Data Parallel Configuration - NODE 1 (Worker)
      - VLLM_DATA_PARALLEL_SIZE=${VLLM_DATA_PARALLEL_SIZE:-2}
      - VLLM_DATA_PARALLEL_RANK=1
      - VLLM_DATA_PARALLEL_ADDRESS=${VLLM_DP_MASTER_IP:-192.168.1.100}
      - VLLM_DATA_PARALLEL_RPC_PORT=${VLLM_DP_PORT:-13345}
      - VLLM_DATA_PARALLEL_SIZE_LOCAL=1

      # Engine Configuration
      - VLLM_TENSOR_PARALLEL_SIZE=1
      - VLLM_MAX_NUM_SEQS=${VLLM_MAX_NUM_SEQS:-256}
      - VLLM_MAX_NUM_BATCHED_TOKENS=${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}

      # Logging
      - VLLM_LOG_LEVEL=${VLLM_LOG_LEVEL:-INFO}

      # CUDA device
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-1}

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - model-cache:/root/.cache/model

    ulimits:
      memlock: -1
      stack: 67108864

    restart: unless-stopped

volumes:
  huggingface-cache:
  model-cache:
