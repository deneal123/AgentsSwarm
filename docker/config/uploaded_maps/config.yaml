robots:
  - name: "carter01"
    labels: ["test", "carter", "ros"]
    heartbeat_timeout: 30
  # - name: "carter02"
  #   labels: ["test", "carter", "ros"]
  #   heartbeat_timeout: 30


services:
  waypoint_graph:
    base_url: "http://195.225.110.91:8000"
  mission_database:
    base_url: "http://185.55.57.82:5003"
  mission_dispatch:
    base_url: "http://185.55.57.82:5002"
    default_mission_timeout: 900
  cuopt:
    base_url: "http://195.225.110.91:5050"
    solve_parameters:
      time_limit: .5
      verbose_mode: False

map:
  map_file: "/tmp/config/uploaded_maps/map.png"
  metadata_yaml: ""

  metadata:
    image: "map.png"
    map_id: "map"
    resolution: 0.05
    x_offset: -5.5
    y_offset: -17.0
    rotation: 0.0
    negate: 0
    occupied_thresh: 0.65
    free_thresh: 0.196

  push_map_on_startup: False
  
constants:
  MIN_BATTERY: 0.0

telemetry:
  SEND_TELEMETRY: False
  TELEMETRY_ID: ""
  TELEMETRY_SECRET: ""
  TELEMETRY_ENV: "DEV" # {DEV | TEST | PROD}
